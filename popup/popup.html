<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Translate</h1>
      <nav class="tabs">
        <button class="tab active" data-tab="translate">Translate</button>
        <button class="tab" data-tab="favorites">Favorites</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>
    </header>

    <!-- Translate Tab -->
    <div id="tab-translate" class="tab-content active">
      <div class="lang-bar">
        <select id="source-lang" class="lang-select"></select>
        <button id="btn-swap" class="btn-swap" title="Swap languages">&#8646;</button>
        <select id="target-lang-translate" class="lang-select"></select>
      </div>

      <div class="field">
        <label for="source-text">Text to translate</label>
        <textarea id="source-text" rows="4" placeholder="Enter text or right-click selected text on any page..."></textarea>
      </div>

      <button id="btn-translate" class="btn-primary">Translate</button>

      <div id="result-area" class="hidden">
        <div class="result-header">
          <div class="detected-lang">
            Detected: <span id="detected-lang">—</span>
          </div>
          <button id="btn-fav" class="btn-fav" title="Save to favorites"></button>
        </div>
        <div class="field">
          <label>Translation</label>
          <div id="translation-output" class="output-box"></div>
        </div>
        <div id="cefr-area" class="extra-field hidden">
          <span id="cefr-badge" class="cefr-badge"></span>
        </div>
        <div id="pronunciation-area" class="extra-field hidden">
          <label>Pronunciation</label>
          <div id="pronunciation-output" class="extra-box pronunciation"></div>
        </div>
        <div id="definition-area" class="extra-field hidden">
          <label>Definition</label>
          <div id="definition-output" class="extra-box"></div>
        </div>
        <div id="example-area" class="extra-field hidden">
          <label>Example</label>
          <div id="example-output" class="extra-box"></div>
        </div>
      </div>

      <div id="error-area" class="hidden">
        <div class="error-msg" id="error-msg"></div>
      </div>

      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <span>Translating...</span>
      </div>
    </div>

    <!-- Favorites Tab -->
    <div id="tab-favorites" class="tab-content hidden">
      <div class="fav-toolbar">
        <select id="fav-filter" class="fav-filter">
          <option value="all">All</option>
          <option value="word">Words / Phrases</option>
          <option value="sentence">Sentences / Paragraphs</option>
        </select>
        <select id="fav-date-filter" class="fav-filter">
          <option value="all">All time</option>
          <option value="today">Today</option>
          <option value="week">This week</option>
          <option value="month">This month</option>
        </select>
      </div>
      <div id="fav-list" class="fav-list">
        <div class="fav-empty">No saved items yet.</div>
      </div>
      <div class="fav-actions">
        <button id="btn-export-fav" class="btn-secondary">Export TXT</button>
        <button id="btn-clear-fav" class="btn-secondary btn-danger">Clear All</button>
      </div>
      <div class="fav-notion-export">
        <label class="fav-export-label">Export to Notion</label>
        <select id="notion-template" class="fav-filter">
          <option value="database">Vocabulary Database</option>
          <option value="report">Study Report</option>
          <option value="flashcard">Flashcard Mode</option>
        </select>
        <button id="btn-export-notion" class="btn-notion-connect" style="margin-top:6px">Export to Notion</button>
      </div>
      <div id="notion-export-status" class="hidden notion-status"></div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-content hidden">
      <div class="field">
        <label>LLM Provider</label>
        <div class="radio-group">
          <label><input type="radio" name="provider" value="gemini" checked> Gemini</label>
          <label><input type="radio" name="provider" value="claude"> Claude</label>
          <label><input type="radio" name="provider" value="azureOpenAI"> Azure OpenAI</label>
        </div>
      </div>

      <div class="field" id="field-gemini-key">
        <label for="key-gemini">Gemini API Key</label>
        <input type="password" id="key-gemini" placeholder="AIza...">
      </div>

      <div class="field" id="field-gemini-model">
        <label for="gemini-model">Gemini Model</label>
        <input type="text" id="gemini-model" value="gemini-2.5-flash" placeholder="gemini-2.5-flash">
      </div>

      <div class="field hidden" id="field-claude-key">
        <label for="key-claude">Claude API Key</label>
        <input type="password" id="key-claude" placeholder="sk-ant-...">
      </div>

      <div class="field hidden" id="field-azure-key">
        <label for="key-azure">Azure OpenAI API Key</label>
        <input type="password" id="key-azure" placeholder="API key">
      </div>

      <div class="field hidden" id="field-azure-endpoint">
        <label for="azure-endpoint">Azure Endpoint</label>
        <input type="text" id="azure-endpoint" placeholder="https://your-resource.openai.azure.com">
      </div>

      <div class="field hidden" id="field-azure-deployment">
        <label for="azure-deployment">Deployment Name</label>
        <input type="text" id="azure-deployment" placeholder="gpt-4o">
      </div>

      <div class="field">
        <label for="target-lang">Target Language</label>
        <select id="target-lang"></select>
      </div>

      <div class="field">
        <label>Translation Options</label>
        <div class="toggle-group">
          <label class="toggle-label">
            <input type="checkbox" id="opt-pronunciation" checked>
            <span>Pronunciation (IPA)</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="opt-definition" checked>
            <span>Definition</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="opt-example" checked>
            <span>Example sentence</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label>Favorites - Save Type</label>
        <select id="opt-save-type">
          <option value="all">All translations</option>
          <option value="word">Words and phrases only</option>
        </select>
      </div>

      <button id="btn-save" class="btn-primary">Save Settings</button>
      <div id="save-status" class="hidden save-status">Settings saved!</div>

      <div class="section-divider"></div>

      <div class="field">
        <label>Notion Integration</label>
        <div id="notion-disconnected">
          <button id="btn-notion-connect" class="btn-notion-connect">Connect to Notion</button>
        </div>
        <div id="notion-connected" class="hidden">
          <div class="notion-info">
            <span id="notion-workspace-name"></span>
            <button id="btn-notion-disconnect" class="btn-link btn-danger-text">Disconnect</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span>AI Translate v1.2.2</span>
      <a href="https://github.com/LemonAniLabs/AI-Extension" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script src="../lib/languages.js"></script>
  <script src="../lib/notion.js"></script>
  <script src="popup.js"></script>
</body>
</html>
